[package]
name = "sagc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bench]]
name = "parse"
path = "benches/parse.rs"
harness = false

[dependencies]
nom = "7.1.3"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
url = { version = "2.5.0", features = ["serde"] }
# sagc-derive = { path = "../sagc-derive" }
actix-web = {version="4.4.0", features = ["openssl"]}
env_logger = "0.11.0"
actix-cors = "0.7.0"
log = "0.4.20"
rand = { version = "0.8.5", features = ["alloc"] }
nom_locate = "4.2.0"
awc = {version = "3.4.0", features = ["openssl"]}
nom-unicode = "0.3.0"
dotenv = "0.15.0"

[dev-dependencies]
criterion = "0.5.1"
